; Simple Loadout System for Controller - settings. There is no in-game settings page; edit this file with the game closed.

[General]
; How many loadouts there are (1-10). Five show at a time beside "Always worn"; the D-pad or the mouse wheel over the bar scrolls the rest.
iLoadoutCount=10

; The buttons' names. An empty name shows as "Loadout N".
sLoadoutName1=
sLoadoutName2=
sLoadoutName3=
sLoadoutName4=
sLoadoutName5=
sLoadoutName6=
sLoadoutName7=
sLoadoutName8=
sLoadoutName9=
sLoadoutName10=

; 1 = loadouts can be switched during combat. 0 (the default) = "You cannot change loadouts in combat", as before.
bAllowSwitchInCombat=0

[Debug]
; Log detail: 0 trace, 1 debug, 2 info, 3 warnings, 4 errors.
uLogLevel=2
